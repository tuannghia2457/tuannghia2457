<svg xmlns="http://www.w3.org/2000/svg" width="390" height="180" viewBox="0 0 390 180">
  <style>
    .name, .meta { opacity: 1; }
    .underline { animation: accentPulse 5s ease-in-out infinite; }
    .corner { animation: cornerSlide 5s ease-out infinite; }

    @keyframes accentPulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes cornerSlide {
      0%, 8% { opacity: 0; transform: translateX(-8px); }
      18%, 90% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .underline, .corner { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="hdr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10" />
      <stop offset="100%" stop-color="#0d0d10" stop-opacity="0.85" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#hdr-bg)" rx="14" ry="14" />
  <g class="corner" opacity="0.6">
    <rect x="24" y="26" width="22" height="2" fill="#dc2626" />
    <rect x="24" y="26" width="2" height="22" fill="#dc2626" />
  </g>
  <g transform="translate(390 0) scale(-1 1)">
    <g class="corner" opacity="0.6">
      <rect x="24" y="26" width="22" height="2" fill="#dc2626" />
      <rect x="24" y="26" width="2" height="22" fill="#dc2626" />
    </g>
  </g>
  <text class="name" x="195" y="84" text-anchor="middle" fill="#f7f7fb" font-family="&quot;Inter&quot;, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-1">Tran Tuan Nghia</text>
  <rect class="underline" x="72" y="108" width="246" height="2" fill="#dc2626" rx="1" />
  <text class="meta" x="195" y="141" text-anchor="middle" fill="#a5a5b3" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.7">SOFTWARE ENGINEER   ·   HO CHI MINH CITY</text>
</svg>
